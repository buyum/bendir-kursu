<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unser Bendir-Kurs</title><style>:root{font-family:system-ui,sans-serif;color:#222;background:#faf8f4}*{box-sizing:border-box}body{margin:0}header{background:#293b37;color:white;padding:20px}main{max-width:760px;margin:auto;padding:18px}h1{font-size:1.6rem;margin:0}h2{font-size:1.25rem}button,input,select{font:inherit}button{padding:12px;border:1px solid #9aa9a3;border-radius:12px;background:white;cursor:pointer;min-height:44px}button:disabled{opacity:.35}input,select{width:100%;padding:13px;border:1px solid #aaa;border-radius:10px;margin:8px 0}.card{background:white;border:1px solid #e0ddd7;border-radius:16px;padding:16px;margin:12px 0}nav{display:flex;gap:8px;flex-wrap:wrap}.active{background:#293b37;color:white}.meta{color:#606b65;font-size:.9rem}.player{width:100%;aspect-ratio:9/16;max-height:560px;border:0;border-radius:12px;background:#eee}.wide{aspect-ratio:16/9}.actions{display:flex;justify-content:space-between;gap:8px}.notes{white-space:pre-wrap;line-height:1.6}a{color:#1b5b65;overflow-wrap:anywhere}@media(min-width:600px){header{padding:25px max(25px,calc((100vw - 760px)/2))}} .notation{display:block;width:100%;height:auto;border-radius:12px;border:1px solid #e0ddd7}.video-section{padding:16px 0;border-top:1px solid #e0ddd7}.video-section h3{font-size:1.08rem;line-height:1.4;margin:0 0 12px}.video-wrap{max-width:330px;margin:0 auto}.video-wrap .player{display:block;max-height:none;aspect-ratio:9/16}.video-section .meta{margin-bottom:0}.fraction{font-size:.88em;font-weight:750;white-space:nowrap;letter-spacing:-.06em}.lesson-title{font-size:clamp(1.65rem,6vw,2.4rem);line-height:1.25;letter-spacing:-.025em;margin:8px 0 0}.lesson-title .fraction{font-size:1.12em}.lesson-prefix{font-size:.72em;color:#4d6158;font-weight:700;letter-spacing:0}.lesson-hero{background:#f6f8f6;border-left:3px solid #9db3a6;border-radius:12px;padding:18px 16px;margin:16px 0 18px}.content-panel{padding:16px;border-radius:14px;margin:18px 0;border:1px solid #e2e5df}.notation-panel{background:#f8faf8;border-left:3px solid #b9cbbf}.videos-panel{background:#f8faff;border-left:3px solid #bdcce1}.notes-panel{background:#fffdf7;border-left:3px solid #e5d7a7}.content-panel h3{margin:0 0 14px;font-size:1.16rem}.video-section{background:#fff;border:1px solid #dbe4f0;border-radius:12px;padding:14px;margin:12px 0}.video-section:first-of-type{border-top:1px solid #dbe4f0}.video-section h4{font-size:1.05rem;line-height:1.45;margin:0 0 12px}.notes-panel .notes-placeholder{margin:0}.card button[data-id] .fraction{font-size:.88em}.notes-placeholder{background:#fff9e5;color:#655721;border:1px solid #eee3bd;border-radius:12px;padding:14px}.video-section h3{font-size:1.12rem}.card button[data-id]{text-align:left;line-height:1.5}.card button[data-id] .fraction{font-size:1.12em} </style></head><body><header><h1>🥁 Unser Bendir-Kurs</h1><p>Videolar, ders notları ve alıştırmalar</p></header><main><nav><button id="byTopic" class="active">Konulara göre</button><button id="byDate">Ders tarihine göre</button></nav><input id="search" placeholder="🔎 Derslerde ara …" aria-label="Derslerde ara"><div id="listing"></div><section id="detail" class="card" hidden></section></main><script>
// Trage hier nur Materialien ein, die für eure Kursgruppe freigegeben sind.
const lessons=[
{id:'l1',order:1,topic:'Rhythmusmuster · Semâî Usûlü',date:'Henüz belirtilmedi',title:'3/4 Semâî Usûlü',videos:[{title:'Ana Kalıp ve Velvelesi - Saf Pratik',url:'https://www.youtube.com/shorts/sJxYn2HG5Mo'},{title:'Ana Kalip - Musiki Pratik',url:'https://www.youtube.com/shorts/utCV3u5ILN8'},{title:'Velvele - Musiki Pratik',url:'https://www.youtube.com/shorts/85tJuMSO5Tg'}],image:'images/3te4_semai-usulu-nota.jpeg',notes:'Ders notları henüz eklenmedi.'}
];
let mode='topic',current=null;const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ordered=[...lessons].sort((a,b)=>a.order-b.order);
function formatTitle(title){const t=String(title||'');return t.startsWith('3/4 ')?'<span class="fraction" aria-label="üç bölü dört">3⁄4</span> '+escapeHtml(t.slice(4)):escapeHtml(t)}
function render(){const term=$('#search').value.toLowerCase();const list=ordered.filter(x=>[x.title,x.topic,x.date,x.notes].join(' ').toLowerCase().includes(term));const groups={};for(const l of list){const key=mode==='topic'?l.topic:(l.date==='Henüz belirtilmedi'?'Ders tarihi henüz belirtilmedi':l.date);(groups[key]??=[]).push(l)}$('#listing').innerHTML=Object.entries(groups).map(([group,ls])=>`<section class="card"><h2>${escapeHtml(group)}</h2>${ls.map(l=>`<p><button data-id="${escapeHtml(l.id)}">${l.order}. Ders: ${formatTitle(l.title)} →</button></p>`).join('')}</section>`).join('')||'<p>Ders bulunamadı.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));$('#byTopic').classList.toggle('active',mode==='topic');$('#byDate').classList.toggle('active',mode==='date')}
function embed(url){try{const u=new URL(url);if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtube-nocookie.com'].includes(u.hostname))return null;let id=u.hostname==='youtu.be'?u.pathname.slice(1):u.pathname.match(/^\/(?:shorts|embed)\/([\w-]+)/)?.[1]||u.searchParams.get('v');return /^[\w-]{11}$/.test(id||'')?'https://www.youtube-nocookie.com/embed/'+id+'?loop=1&playlist='+id:null}catch{return null}}
function show(id){
 current=id;const l=ordered.find(x=>x.id===id);if(!l)return;const i=ordered.indexOf(l);
 const videos=(l.videos||[]).map((v,n)=>{const src=embed(v.url);return `<section class="video-section"><h4>${n+1}. Alıştırma: ${escapeHtml(v.title)}</h4>${src?`<div class="video-wrap"><iframe class="player" src="${src}" title="${escapeHtml(v.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`:'<p>Video burada oynatılamıyor. <a href="${escapeHtml(v.url)}" target="_blank" rel="noopener noreferrer">YouTube’da izle</a></p>'}</section>`}).join('');
 $('#detail').hidden=false;
 $('#detail').innerHTML=`<div class="lesson-hero"><h2 class="lesson-title"><span class="lesson-prefix">${i+1}. Ders:</span> ${formatTitle(l.title)}</h2></div>${l.image?`<section class="content-panel notation-panel"><h3>Nota Görseli – Ana Usûl ve Velvele</h3><a href="${escapeHtml(l.image)}" target="_blank" rel="noopener noreferrer" aria-label="Nota görselini tam boyutta aç"><img src="${escapeHtml(l.image)}" alt="Semâî Usûlü: Ana Usûl ve Velvele nota görseli" class="notation" loading="lazy"></a><p class="meta">Nota görselini tam boyutta açmak için üzerine dokunun.</p></section>`:''}<section class="content-panel videos-panel"><h3>Alıştırmalar</h3>${videos}</section><section class="content-panel notes-panel"><h3>Ders Notları</h3><p class="notes notes-placeholder">${escapeHtml(l.notes)}</p></section><div class="actions"><button id="prev" ${i===0?'disabled':''}>← Önceki Ders</button><button id="next" ${i===ordered.length-1?'disabled':''}>Sonraki Ders →</button></div>`;
 $('#prev').onclick=()=>show(ordered[i-1]?.id);$('#next').onclick=()=>show(ordered[i+1]?.id);$('#detail').scrollIntoView({behavior:'smooth',block:'start'});
}
$('#byTopic').onclick=()=>{mode='topic';render()};$('#byDate').onclick=()=>{mode='date';render()};$('#search').oninput=render;render();
</script></body></html>
