<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unser Bendir-Kurs</title><style>:root{font-family:system-ui,sans-serif;color:#222;background:#faf8f4}*{box-sizing:border-box}body{margin:0}header{background:#293b37;color:white;padding:20px}main{max-width:760px;margin:auto;padding:18px}h1{font-size:1.6rem;margin:0}h2{font-size:1.25rem}button,input,select{font:inherit}button{padding:12px;border:1px solid #9aa9a3;border-radius:12px;background:white;cursor:pointer;min-height:44px}button:disabled{opacity:.35}input,select{width:100%;padding:13px;border:1px solid #aaa;border-radius:10px;margin:8px 0}.card{background:white;border:1px solid #e0ddd7;border-radius:16px;padding:16px;margin:12px 0}nav{display:flex;gap:8px;flex-wrap:wrap}.active{background:#293b37;color:white}.meta{color:#606b65;font-size:.9rem}.player{width:100%;aspect-ratio:9/16;max-height:560px;border:0;border-radius:12px;background:#eee}.wide{aspect-ratio:16/9}.actions{display:flex;justify-content:space-between;gap:8px}.notes{white-space:pre-wrap;line-height:1.6}a{color:#1b5b65;overflow-wrap:anywhere}@media(min-width:600px){header{padding:25px max(25px,calc((100vw - 760px)/2))}} </style></head><body><header><h1>🥁 Unser Bendir-Kurs</h1><p>Videos, Notizen und Übungen in Lernreihenfolge</p></header><main><nav><button id="byTopic" class="active">Nach Themen</button><button id="byDate">Nach Unterrichtstermin</button></nav><input id="search" placeholder="🔎 Lektionen suchen …" aria-label="Lektionen suchen"><div id="listing"></div><section id="detail" class="card" hidden></section></main><script>
// Trage hier nur Materialien ein, die für eure Kursgruppe freigegeben sind.
const lessons=[
{id:'l1',order:1,topic:'Rhythmusmuster · Semâî Usûlü',date:'Noch nicht eingetragen',title:'1. Ders – 3/4 Semâî Usûlü Ana Kalıp ve Velvelesi',type:'youtube',url:'https://www.youtube.com/shorts/sJxYn2HG5Mo',image:'images/3te4_semai-usulu-nota.jpeg',notes:'Notenbild: Ana Usûl und Velvele. Weitere Unterrichtsnotizen können hier ergänzt werden.'}
];
let mode='topic',current=null;const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ordered=[...lessons].sort((a,b)=>a.order-b.order);
function render(){const term=$('#search').value.toLowerCase();const list=ordered.filter(x=>[x.title,x.topic,x.date,x.notes].join(' ').toLowerCase().includes(term));const groups={};for(const l of list){const key=mode==='topic'?l.topic:(l.date==='Noch nicht eingetragen'?'Unterrichtsdatum noch offen':l.date);(groups[key]??=[]).push(l)}$('#listing').innerHTML=Object.entries(groups).map(([group,ls])=>`<section class="card"><h2>${escapeHtml(group)}</h2>${ls.map(l=>`<p><button data-id="${escapeHtml(l.id)}">${l.order}. ${escapeHtml(l.title)} →</button></p>`).join('')}</section>`).join('')||'<p>Keine Lektionen gefunden.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));$('#byTopic').classList.toggle('active',mode==='topic');$('#byDate').classList.toggle('active',mode==='date')}
function embed(url){try{const u=new URL(url);if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtube-nocookie.com'].includes(u.hostname))return null;let id=u.hostname==='youtu.be'?u.pathname.slice(1):u.pathname.match(/^\/(?:shorts|embed)\/([\w-]+)/)?.[1]||u.searchParams.get('v');return /^[\w-]{11}$/.test(id||'')?'https://www.youtube-nocookie.com/embed/'+id:null}catch{return null}}
function show(id){current=id;const l=ordered.find(x=>x.id===id);if(!l)return;const i=ordered.indexOf(l);let media='<p class="meta">Noch kein Video hinterlegt.</p>';if(l.url){if(l.type==='youtube'){const src=embed(l.url);media=src?`<iframe class="player ${l.url.includes('/shorts/')?'':'wide'}" src="${src}" title="${escapeHtml(l.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`:'<p>Ungültiger YouTube-Link.</p>'}else{media=`<p><a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">Material öffnen ↗</a></p>`}}$('#detail').hidden=false;$('#detail').innerHTML=`<p class="meta">Lektion ${i+1} von ${ordered.length} · ${escapeHtml(l.topic)} · ${escapeHtml(l.date)}</p><h2>${escapeHtml(l.title)}</h2>${l.image?`<h3>Notenbild</h3><a href="${escapeHtml(l.image)}" target="_blank" rel="noopener" aria-label="Notenbild in voller Größe öffnen"><img src="${escapeHtml(l.image)}" alt="Semâî Usûlü: Ana Usûl und Velvele, Notenbild" style="display:block;width:100%;height:auto;border-radius:12px;border:1px solid #e0ddd7" loading="lazy"></a><p class="meta">Tippe auf das Bild, um es in voller Größe zu öffnen.</p>`:''}<h3>Video – direkt abspielen</h3>${media}<p><a href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">Alternativ auf YouTube öffnen</a></p><h3>Notizen</h3><p class="notes">${escapeHtml(l.notes)}</p><div class="actions"><button id="prev" ${i===0?'disabled':''}>← Zurück</button><button id="next" ${i===ordered.length-1?'disabled':''}>Weiter →</button></div>`;$('#prev').onclick=()=>show(ordered[i-1]?.id);$('#next').onclick=()=>show(ordered[i+1]?.id);$('#detail').scrollIntoView({behavior:'smooth',block:'start'})}
$('#byTopic').onclick=()=>{mode='topic';render()};$('#byDate').onclick=()=>{mode='date';render()};$('#search').oninput=render;render();
</script></body></html>
