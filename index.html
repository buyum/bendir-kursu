// 1.17: reveal the slim header after the hero has scrolled away;
// hide while scrolling down, show while scrolling up.
(function initCompactHeader(){
 const compact=document.getElementById('compactHeader');
 const hero=document.querySelector('.hero-header');
 if(!compact||!hero)return;
 const mobileQuery=window.matchMedia("(max-width: 600px)");
 let lastY=Math.max(0,window.scrollY),visible=false;
 function setVisible(next){
  if(visible===next)return;
  visible=next;
  compact.classList.toggle('is-visible',next);
  compact.setAttribute('aria-hidden',String(!next));
 }
 function update(){
  const y=Math.max(0,window.scrollY);
  if(!mobileQuery.matches){setVisible(false);lastY=y;return;}
  const heroEnd=hero.getBoundingClientRect().bottom;
  const delta=y-lastY;
  if(heroEnd>0 || y<80){setVisible(false)}
  else if(delta < -3){setVisible(true)}
  else if(delta > 3){setVisible(false)}
  lastY=y;
 }
 window.addEventListener('scroll',update,{passive:true});
 window.addEventListener('resize',update,{passive:true});
 mobileQuery.addEventListener?.('change',update);
 update();
})();

// Notation lightbox: click to open, pinch/wheel/double-tap to zoom, drag to pan.
(function initNotationLightbox(){
 const viewer=document.getElementById('notationLightbox');
 const stage=document.getElementById('notationLightboxStage');
 const image=document.getElementById('notationLightboxImage');
 const title=document.getElementById('notationLightboxTitle');
 const closeButton=document.getElementById('notationLightboxClose');
 const pointers=new Map();
 let scale=1,x=0,y=0,baseWidth=1,baseHeight=1,lastDistance=0,lastMid=null,previousFocus=null;
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 function constrain(){
  const bounds=stage.getBoundingClientRect();
  x=clamp(x,-Math.max(0,(baseWidth*scale-bounds.width)/2),Math.max(0,(baseWidth*scale-bounds.width)/2));
  y=clamp(y,-Math.max(0,(baseHeight*scale-bounds.height)/2),Math.max(0,(baseHeight*scale-bounds.height)/2));
 }
 function paint(){constrain();image.style.transform=`translate(-50%, -50%) translate(${x}px, ${y}px) scale(${scale})`;}
 function resetSize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  if(!w||!h||!image.naturalWidth||!image.naturalHeight)return;
  const ratio=Math.min(w/image.naturalWidth,h/image.naturalHeight,1);
  baseWidth=image.naturalWidth*ratio;baseHeight=image.naturalHeight*ratio;
  image.style.width=baseWidth+'px';image.style.height=baseHeight+'px';
  scale=1;x=0;y=0;paint();
 }
 function open(src,alt,heading){
  previousFocus=document.activeElement;
  image.onload=resetSize;
  image.src=src;image.alt=alt||heading||'Nota görseli';
  title.textContent=heading||alt||'Nota görseli';
  viewer.hidden=false;document.body.classList.add('notation-viewer-open');
  pointers.clear();lastDistance=0;lastMid=null;
  if(image.complete&&image.naturalWidth)resetSize();
  closeButton.focus();
 }
 function close(){
  viewer.hidden=true;document.body.classList.remove('notation-viewer-open');
  pointers.clear();image.onload=null;image.removeAttribute('src');
  if(previousFocus?.isConnected)previousFocus.focus();
 }
 function zoom(factor,cx=stage.clientWidth/2,cy=stage.clientHeight/2){
  const next=clamp(scale*factor,1,6),f=next/scale;
  x=(x-(cx-stage.clientWidth/2))*f+(cx-stage.clientWidth/2);
  y=(y-(cy-stage.clientHeight/2))*f+(cy-stage.clientHeight/2);
  scale=next;paint();
 }
 document.addEventListener('click',event=>{
  const anchor=event.target.closest?.('.notation-panel a:has(img.notation)');
  if(!anchor)return;
  event.preventDefault();
  const img=anchor.querySelector('img.notation');
  open(anchor.href,img?.alt,anchor.closest('.notation-panel')?.querySelector('h3')?.textContent);
 });
 closeButton.addEventListener('click',close);
 viewer.addEventListener('click',event=>{if(event.target===viewer)close();});
 document.addEventListener('keydown',event=>{
  if(viewer.hidden)return;
  if(event.key==='Escape'){event.preventDefault();close();}
  if(event.key==='Tab'){event.preventDefault();closeButton.focus();}
 });
 stage.addEventListener('wheel',event=>{event.preventDefault();const r=stage.getBoundingClientRect();zoom(Math.exp(-event.deltaY*.002),event.clientX-r.left,event.clientY-r.top);},{passive:false});
 stage.addEventListener('dblclick',event=>{const r=stage.getBoundingClientRect();zoom(scale>1?1/scale:2.5,event.clientX-r.left,event.clientY-r.top);});
 stage.addEventListener('pointerdown',event=>{
  event.preventDefault();stage.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  stage.classList.add('is-dragging');lastDistance=0;lastMid=null;
 });
 stage.addEventListener('pointermove',event=>{
  if(!pointers.has(event.pointerId))return;
  const old=pointers.get(event.pointerId);
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  if(pointers.size===1){x+=event.clientX-old.x;y+=event.clientY-old.y;paint();}
  else if(pointers.size===2){
   const [a,b]=[...pointers.values()];
   const distance=Math.hypot(a.x-b.x,a.y-b.y);
   const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
   if(lastMid){x+=mid.x-lastMid.x;y+=mid.y-lastMid.y;}
   if(lastDistance){const r=stage.getBoundingClientRect();zoom(distance/lastDistance,mid.x-r.left,mid.y-r.top);}
   else paint();
   lastDistance=distance;lastMid=mid;
  }
 });
 function release(event){pointers.delete(event.pointerId);lastDistance=0;lastMid=null;if(!pointers.size)stage.classList.remove('is-dragging');}
 stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
 window.addEventListener('resize',()=>{if(!viewer.hidden)resetSize();});
})();
