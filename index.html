function show(id,scroll=true){
 current=id;if(activeView==='dersler')syncRoute();const l=ordered.find(x=>x.id===id);if(!l)return;syncPicker();const i=ordered.indexOf(l);
 const images=l.placeholder?`<section class="content-panel notation-panel"><h3>[Nota Görseli – Başlık]</h3><p class="meta">[Nota görseli eklenecek]</p></section>`:(l.images||[]).map(im=>`<section class="content-panel notation-panel"><h3>${escapeHtml(im.title)}</h3><a href="${escapeHtml(im.src)}" target="_blank" rel="noopener noreferrer" aria-label="Nota görselini tam boyutta aç"><img src="${escapeHtml(im.src)}" alt="${escapeHtml(im.alt)}" class="notation" loading="lazy"></a><p class="meta">Nota görselini tam boyutta açmak için üzerine dokunun.</p></section>`).join('');
 const videos=l.placeholder?'<section class="video-section"><h4>1. Alıştırma: [Alıştırma başlığı]</h4><p class="meta">[Video bağlantısı eklenecek]</p></section>':(l.videos||[]).map((v,n)=>{const src=embed(v.url);return `<section class="video-section"><h4>${n+1}. Alıştırma: ${escapeHtml(v.title)}</h4>${src?`<div class="video-wrap"><iframe class="player" src="${src}" title="${escapeHtml(v.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`:`<p>Video burada oynatılamıyor. <a href="${escapeHtml(v.url)}" target="_blank" rel="noopener noreferrer">YouTube’da izle</a></p>`}</section>`}).join('');
 $('#detail').hidden=false;
 $('#detail').innerHTML=`<div class="lesson-hero"><h2 class="lesson-title"><span class="lesson-prefix">${l.order}. Ders:</span> ${formatTitle(l.title)}</h2></div>${images}<section class="content-panel videos-panel"><h3>Alıştırmalar</h3>${videos}</section><section class="content-panel notes-panel"><h3>Ders Notları</h3><p class="notes notes-placeholder">${escapeHtml(l.notes)}</p></section><div class="actions"><button id="prev">← ${i===0?'Temel Bilgiler':`${ordered[i-1].order}. Ders: ${formatTitle(ordered[i-1].title)}`}</button>${i<ordered.length-1?`<button id="next">${ordered[i+1].order}. Ders: ${formatTitle(ordered[i+1].title)} →</button>`:''}</div>`;
 placeShareIcon();$('#prev').onclick=()=>i===0?showBasics():show(ordered[i-1].id);if(i<ordered.length-1)$('#next').onclick=()=>show(ordered[i+1].id);if(scroll)$('#detail').scrollIntoView({behavior:'smooth',block:'start'});
}
function notationMarkup(im){return `<section class="content-panel notation-panel"><h3>${escapeHtml(im.title)}</h3><a href="${escapeHtml(im.src)}" target="_blank" rel="noopener noreferrer" aria-label="Nota görselini tam boyutta aç"><img src="${escapeHtml(im.src)}" alt="${escapeHtml(im.alt)}" class="notation" loading="lazy"></a><p class="meta">Nota görselini tam boyutta açmak için üzerine dokunun.</p></section>`}
function videoMarkup(v,n){const src=embed(v.url);return `<section class="video-section"><h4>${n+1}. Alıştırma: ${escapeHtml(v.title)}</h4>${src?`<div class="video-wrap"><iframe class="player" src="${src}" title="${escapeHtml(v.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`:`<p><a href="${escapeHtml(v.url)}" target="_blank" rel="noopener noreferrer">YouTube’da izle</a></p>`}</section>`}
function placeShareIcon(){
 const root=activeView==='dersler'?$('#detail'):$('#library');
 const heading=root.querySelector(activeView==='dersler'?'.lesson-hero .lesson-title':'.library-title');
 if(!heading)return;
 const wrapper=document.createElement('div');
 wrapper.className='title-share-container';
 const row=document.createElement('div');
 row.className='title-share-row';
 heading.parentNode.insertBefore(wrapper,heading);
 wrapper.appendChild(row);
 row.appendChild(heading);
 const btn=document.createElement('button');
 btn.type='button';btn.className='share-icon';btn.id='shareLink';
 btn.setAttribute('aria-label','Paylaş veya bağlantıyı kopyala');
 btn.title='Paylaş';
 btn.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5"></path><path d="M5 13v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5"></path></svg>';
 row.appendChild(btn);
 const status=document.createElement('span');
 status.id='shareFeedback';status.className='share-feedback';
 status.setAttribute('role','status');status.setAttribute('aria-live','polite');
 wrapper.appendChild(status);
 btn.addEventListener('click',shareCurrentLink);
}
async function shareCurrentLink(){
 const link=shareUrl();
 if(typeof navigator.share==='function'){
  try{
   const heading=(activeView==='dersler'?$('#detail'):$('#library')).querySelector('.lesson-title,.library-title');
   await navigator.share({title:heading?.textContent?.trim()||'Bendir Kursu',url:link});
   return;
  }catch(error){
   if(error?.name==='AbortError')return;
  }
 }
 await copyCurrentLink();
}
async function copyCurrentLink(){
 const link=shareUrl();
 try{
  if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(link);
  else {const field=document.createElement('textarea');field.value=link;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw new Error('copy failed');}
  $('#shareFeedback').textContent='Bağlantı kopyalandı.';
 }catch{$('#shareFeedback').textContent='Bağlantı kopyalanamadı: '+link;}
}
function setView(view,scrollToPicker=false){
 activeView=view;
 document.querySelectorAll('[data-view]').forEach(b=>{const selected=b.dataset.view===view;b.classList.toggle('selected',selected);b.setAttribute('aria-current',selected?'page':'false')});
 const isLessons=view==='dersler';$('#lessonControls').hidden=!isLessons;$('#detail').hidden=!isLessons;$('#library').hidden=isLessons;
 if(isLessons){if(current==='basics')showBasics(!scrollToPicker);else show(current||ordered[0].id,!scrollToPicker);if(scrollToPicker)requestAnimationFrame(()=>$('#lessonControls').scrollIntoView({behavior:'smooth',block:'start'}));return}
 if(view==='temel'){$('#library').innerHTML=`<div class="library-card"><h2 class="library-title">Temel Bilgiler</h2><h3>Bendir Sesleri ve Vuruş Yerleri</h3><a href="images/bendir-ses.png" target="_blank" rel="noopener noreferrer"><img src="images/bendir-ses.png" class="basics-image" alt="Bendir üzerinde temel vuruş yerleri" loading="lazy"></a><p class="meta">Görseli tam boyutta açmak için üzerine dokunun.</p></div>`}
 else if(view==='notalar'){$('#library').innerHTML=`<h2 class="library-title">Usûl Notaları</h2><p class="library-intro">Usûllerin nota görselleri</p>`+ordered.map(l=>`<article class="library-card"><h3>${l.order}. Ders: ${formatTitle(l.title)}</h3>${(l.images||[]).map(notationMarkup).join('')||'<p>[Nota görseli eklenecek]</p>'}</article>`).join('')}
 else if(view==='videolar'){$('#library').innerHTML=`<h2 class="library-title">Alıştırma Videoları</h2><p class="library-intro">Usûllere göre alıştırmalar</p>`+ordered.map(l=>`<article class="library-card"><h3>${l.order}. Ders: ${formatTitle(l.title)}</h3>${(l.videos||[]).map(videoMarkup).join('')||'<p>[Video bağlantısı eklenecek]</p>'}</article>`).join('')}
 if(!isLessons){placeShareIcon();syncRoute();}
 window.scrollTo({top:0,behavior:'smooth'});
}
// URL-Parameter für direkte Links; keine serverseitigen Routen nötig.
const PUBLIC_SITE='https://buyum.github.io/bendir-kursu/';
function routeParams(){
 if(activeView==='dersler')return current==='basics'?{seite:'grundlagen'}:{ders:String(ordered.find(l=>l.id===current)?.order||1)};
 return {seite:({temel:'grundlagen',notalar:'notalar',videolar:'videolar'})[activeView]||'grundlagen'};
}
function shareUrl(){
 const url=new URL(location.protocol==='file:'?PUBLIC_SITE:location.href);
 url.search='';url.hash='';
 Object.entries(routeParams()).forEach(([k,v])=>url.searchParams.set(k,v));
 return url.toString();
}
function syncRoute(){
 if(suppressRoute)return;
 const url=new URL(location.href),params=routeParams();
 url.searchParams.delete('ders');url.searchParams.delete('seite');
 Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
 if(url.href!==location.href)history.pushState(null,'',url);
 const feedback=$('#shareFeedback');if(feedback)feedback.textContent='';
}
function restoreRoute(){
 const p=new URLSearchParams(location.search),lesson=p.get('ders'),page=p.get('seite');
 suppressRoute=true;
 if(lesson && ordered.some(l=>String(l.order)===lesson)){
  const l=ordered.find(l=>String(l.order)===lesson);
  current=l.id;setView('dersler');
 }else if(page==='notalar')setView('notalar');
 else if(page==='videolar')setView('videolar');
 else if(page==='grundlagen')setView('temel');
 else setView('temel');
 suppressRoute=false;
}
render();
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view,b.dataset.view==='dersler')));
window.addEventListener('popstate',restoreRoute);

restoreRoute();

// 1.17: reveal the slim header after the hero has scrolled away;
// hide while scrolling down, show while scrolling up.
(function initCompactHeader(){
 const compact=document.getElementById('compactHeader');
 const hero=document.querySelector('.hero-header');
 if(!compact||!hero)return;
 const mobileQuery=window.matchMedia("(max-width: 600px)");
 let lastY=Math.max(0,window.scrollY),visible=false;
 function setVisible(next){
  if(visible===next)return;
  visible=next;
  compact.classList.toggle('is-visible',next);
  compact.setAttribute('aria-hidden',String(!next));
 }
 function update(){
  const y=Math.max(0,window.scrollY);
  if(!mobileQuery.matches){setVisible(false);lastY=y;return;}
  const heroEnd=hero.getBoundingClientRect().bottom;
  const delta=y-lastY;
  if(heroEnd>0 || y<80){setVisible(false)}
  else if(delta < -3){setVisible(true)}
  else if(delta > 3){setVisible(false)}
  lastY=y;
 }
 window.addEventListener('scroll',update,{passive:true});
 window.addEventListener('resize',update,{passive:true});
 mobileQuery.addEventListener?.('change',update);
 update();
})();
</script></body></html>
