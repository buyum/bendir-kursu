<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bendir Kursu</title>
<!-- DEBUG-EINSTELLUNG: true = Debug-Fußzeile sichtbar; false = ausgeblendet. -->
<script>
const DEBUG_MODE = true; // Bei Bedarf auf false ändern.
if (DEBUG_MODE) document.documentElement.classList.add('debug-mode');
</script>
<style>:root{font-family:system-ui,sans-serif;color:#222;background:#faf8f4}*{box-sizing:border-box}body{margin:0}header{background:#293b37;color:white;padding:20px}main{max-width:760px;margin:auto;padding:18px}h1{font-size:1.6rem;margin:0}h2{font-size:1.25rem}button,input,select{font:inherit}button{padding:12px;border:1px solid #9aa9a3;border-radius:12px;background:white;cursor:pointer;min-height:44px}button:disabled{opacity:.35}input,select{width:100%;padding:13px;border:1px solid #aaa;border-radius:10px;margin:8px 0}.card{background:white;border:1px solid #e0ddd7;border-radius:16px;padding:16px;margin:12px 0}nav{display:flex;gap:8px;flex-wrap:wrap}.active{background:#293b37;color:white}.meta{color:#606b65;font-size:.9rem}.player{width:100%;aspect-ratio:9/16;max-height:560px;border:0;border-radius:12px;background:#eee}.wide{aspect-ratio:16/9}.actions{display:flex;justify-content:space-between;gap:8px}.notes{white-space:pre-wrap;line-height:1.6}a{color:#1b5b65;overflow-wrap:anywhere}@media(min-width:600px){header{padding:25px max(25px,calc((100vw - 760px)/2))}} .notation{display:block;width:100%;height:auto;border-radius:12px;border:1px solid #e0ddd7}.video-section{padding:16px 0;border-top:1px solid #e0ddd7}.video-section h3{font-size:1.08rem;line-height:1.4;margin:0 0 12px}.video-wrap{max-width:330px;margin:0 auto}.video-wrap .player{display:block;max-height:none;aspect-ratio:9/16}.video-section .meta{margin-bottom:0}.fraction{font-size:.88em;font-weight:750;white-space:nowrap;letter-spacing:-.06em}.lesson-title{font-size:clamp(1.65rem,6vw,2.4rem);line-height:1.25;letter-spacing:-.025em;margin:8px 0 0}.lesson-title .fraction{font-size:1.12em}.lesson-prefix{font-size:.72em;color:#4d6158;font-weight:700;letter-spacing:0}.lesson-hero{background:transparent;border:0;border-bottom:2px solid #e3e5e2;border-radius:0;padding:10px 0 20px;margin:8px 0 24px}.lesson-hero .lesson-title{margin:0}.lesson-hero .lesson-prefix{color:inherit}.content-panel{padding:16px;border-radius:14px;margin:18px 0;border:1px solid #e2e5df}.notation-panel{background:#f8faf8;border-left:3px solid #b9cbbf}.videos-panel{background:#f8faff;border-left:3px solid #bdcce1}.notes-panel{background:#fffdf7;border-left:3px solid #e5d7a7}.content-panel h3{margin:0 0 14px;font-size:1.16rem}.video-section{background:#fff;border:1px solid #dbe4f0;border-radius:12px;padding:14px;margin:12px 0}.video-section:first-of-type{border-top:1px solid #dbe4f0}.video-section h4{font-size:1.05rem;line-height:1.45;margin:0 0 12px}.notes-panel .notes-placeholder{margin:0}.card button[data-id] .fraction{font-size:.88em}.notes-placeholder{background:#fff9e5;color:#655721;border:1px solid #eee3bd;border-radius:12px;padding:14px}.video-section h3{font-size:1.12rem}.card button[data-id]{text-align:left;line-height:1.5}.card button[data-id] .fraction{font-size:1.12em}.notation-panel + .notation-panel{margin-top:10px}.lesson-hero{clear:both}.site-footer{display:none;max-width:760px;margin:34px auto 0;padding:18px 18px 28px;border-top:1px solid #e5e5df;text-align:center;color:#7b817c;font-size:.78rem;line-height:1.6}.debug-mode .site-footer{display:block}.site-footer .build-meta{font-variant-numeric:tabular-nums}.site-footer .refresh-link{display:inline-flex;align-items:center;justify-content:center;margin-top:5px;padding:5px 9px;min-height:32px;border:0;background:transparent;color:#6b7770;font:inherit;text-decoration:underline;text-decoration-color:#c9d1cb;text-underline-offset:3px;cursor:pointer}.site-footer .refresh-link:hover,.site-footer .refresh-link:focus-visible{color:#293b37;text-decoration-color:currentColor} </style></head><body><header><h1>🥁 Bendir Kursu</h1><p>Videolar, ders notları ve alıştırmalar</p></header><main><nav><button id="byTopic" class="active">Konulara göre</button><button id="byDate">Ders tarihine göre</button></nav><input id="search" placeholder="🔎 Derslerde ara …" aria-label="Derslerde ara"><div id="listing"></div><section id="detail" class="card" hidden></section></main><footer class="site-footer"><div class="build-meta" id="buildMeta" aria-label="Sürüm ve son güncelleme">Sürüm 1.5 · Son güncelleme tarihi yayınlandıktan sonra görüntülenir.</div><button type="button" id="refreshPage" class="refresh-link" aria-label="Sayfayı yeniden yükle">↻ Sayfayı yenile</button></footer><script>
// Visible course version is maintained manually; GitHub supplies the commit date.
const COURSE_VERSION = "1.5";
// GitHub commit information is loaded only on the published site.
// A local file preview deliberately displays "Önizleme" instead of an invented commit.
async function loadBuildMeta(){
 const el=document.getElementById('buildMeta');
 if(location.protocol==='file:')return;
 const url='https://api.github.com/repos/ozlem-ozkazan/bendir-kursu/commits?per_page=1&_='+Date.now();
 try{
  const response=await fetch(url,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
  if(!response.ok)throw new Error('GitHub API unavailable');
  const commits=await response.json();
  const latest=commits[0];
  if(!latest?.sha || !latest?.commit?.committer?.date)throw new Error('Missing commit data');
  
  const date=new Date(latest.commit.committer.date);
  const formatted=new Intl.DateTimeFormat('tr-TR',{timeZone:'Europe/Istanbul',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
  el.replaceChildren();
  el.textContent='Sürüm '+COURSE_VERSION+' · Son güncelleme tarihi: '+formatted+' (TR)';
 }catch{
  el.replaceChildren();
  el.textContent='Sürüm '+COURSE_VERSION+' · Son güncelleme tarihi şu anda görüntülenemiyor.';
 }
}
if (DEBUG_MODE) loadBuildMeta();
// Reload the HTML with a unique URL to bypass an older browser cache entry.
// This cannot make an unpublished GitHub Pages deployment appear early.
document.getElementById('refreshPage').addEventListener('click',()=>{
 const fresh=new URL(window.location.href);
 fresh.searchParams.set('v',String(Date.now()));
 window.location.assign(fresh.toString());
});
// Trage hier nur Materialien ein, die für eure Kursgruppe freigegeben sind.
const lessons=[
 {id:'l1',order:1,topic:'Semâî Usûlü',date:null,title:'3/4 Semâî Usûlü',videos:[{title:'Ana Kalıp ve Velvelesi - Saf Pratik',url:'https://www.youtube.com/shorts/sJxYn2HG5Mo'},{title:'Ana Kalip - Musiki Pratik',url:'https://www.youtube.com/shorts/utCV3u5ILN8'},{title:'Velvele - Musiki Pratik',url:'https://www.youtube.com/shorts/85tJuMSO5Tg'}],images:[{title:'Nota Görseli – Ana Usûl ve Velvele',src:'images/3te4_semai-usulu-nota.jpeg',alt:'Semâî Usûlü – Ana Usûl ve Velvele'}],notes:'Ders notları henüz eklenmedi.'},
 {id:'l2',order:2,topic:'Sofya’n Usûlü',date:null,title:'4/4 Sofya’n Usûlü',videos:[{title:'Ana Kalıp ve Velvelesi - Saf Pratik',url:'https://www.youtube.com/shorts/XjtrsKE0Lc8'},{title:'Ana Kalip - Velvele Musiki Pratik',url:'https://www.youtube.com/shorts/9-bhRI9K0vY'}],images:[{title:'Nota Görseli – Ana Usûl',src:'images/4te4_sofyan-usulu-ana-unul-nota.jpeg',alt:'Sofya’n Usûlü – Ana Usûl'},{title:'Nota Görseli – Velvele',src:'images/4te4_sofyan-usulu-nota-velvele.jpeg',alt:'Sofya’n Usûlü – Velvele'}],notes:'Ders notları henüz eklenmedi.'},
 {id:'l3',order:3,topic:'[Konu başlığı]',date:null,title:'[Ders başlığı]',videos:[],images:[],notes:'Ders notları henüz eklenmedi.',placeholder:true}
];
let mode='topic',current=null;const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ordered=[...lessons].sort((a,b)=>a.order-b.order);
function formatTitle(title){const t=String(title||'');return escapeHtml(t).replace(/3\/4/g,'<span class="fraction" aria-label="üç bölü dört">3⁄4</span>').replace(/4\/4/g,'<span class="fraction" aria-label="dört bölü dört">4⁄4</span>')}
function render(){const term=$('#search').value.toLowerCase();const list=ordered.filter(x=>[x.title,x.topic,x.date,x.notes].join(' ').toLowerCase().includes(term));const groups={};for(const l of list){const key=mode==='topic'?l.topic:(l.date||'Tarihi belirtilmeyen dersler');(groups[key]??=[]).push(l)}$('#listing').innerHTML=Object.entries(groups).map(([group,ls])=>`<section class="card"><h2>${escapeHtml(group)}</h2>${ls.map(l=>`<p><button data-id="${escapeHtml(l.id)}">${l.order}. Ders: ${formatTitle(l.title)} →</button></p>`).join('')}</section>`).join('')||'<p>Ders bulunamadı.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));$('#byTopic').classList.toggle('active',mode==='topic');$('#byDate').classList.toggle('active',mode==='date')}
function embed(url){try{const u=new URL(url);if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtube-nocookie.com'].includes(u.hostname))return null;let id=u.hostname==='youtu.be'?u.pathname.slice(1):u.pathname.match(/^\/(?:shorts|embed)\/([\w-]+)/)?.[1]||u.searchParams.get('v');return /^[\w-]{11}$/.test(id||'')?'https://www.youtube-nocookie.com/embed/'+id+'?loop=1&playlist='+id:null}catch{return null}}
function show(id){
 current=id;const l=ordered.find(x=>x.id===id);if(!l)return;const i=ordered.indexOf(l);
 const images=l.placeholder?`<section class="content-panel notation-panel"><h3>[Nota Görseli – Başlık]</h3><p class="meta">[Nota görseli eklenecek]</p></section>`:(l.images||[]).map(im=>`<section class="content-panel notation-panel"><h3>${escapeHtml(im.title)}</h3><a href="${escapeHtml(im.src)}" target="_blank" rel="noopener noreferrer" aria-label="Nota görselini tam boyutta aç"><img src="${escapeHtml(im.src)}" alt="${escapeHtml(im.alt)}" class="notation" loading="lazy"></a><p class="meta">Nota görselini tam boyutta açmak için üzerine dokunun.</p></section>`).join('');
 const videos=l.placeholder?'<section class="video-section"><h4>1. Alıştırma: [Alıştırma başlığı]</h4><p class="meta">[Video bağlantısı eklenecek]</p></section>':(l.videos||[]).map((v,n)=>{const src=embed(v.url);return `<section class="video-section"><h4>${n+1}. Alıştırma: ${escapeHtml(v.title)}</h4>${src?`<div class="video-wrap"><iframe class="player" src="${src}" title="${escapeHtml(v.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`:`<p>Video burada oynatılamıyor. <a href="${escapeHtml(v.url)}" target="_blank" rel="noopener noreferrer">YouTube’da izle</a></p>`}</section>`}).join('');
 $('#detail').hidden=false;
 $('#detail').innerHTML=`<div class="lesson-hero"><h2 class="lesson-title"><span class="lesson-prefix">${l.order}. Ders:</span> ${formatTitle(l.title)}</h2></div>${images}<section class="content-panel videos-panel"><h3>Alıştırmalar</h3>${videos}</section><section class="content-panel notes-panel"><h3>Ders Notları</h3><p class="notes notes-placeholder">${escapeHtml(l.notes)}</p></section><div class="actions"><button id="prev" ${i===0?'disabled':''}>← Önceki Ders</button><button id="next" ${i===ordered.length-1?'disabled':''}>Sonraki Ders →</button></div>`;
 $('#prev').onclick=()=>show(ordered[i-1]?.id);$('#next').onclick=()=>show(ordered[i+1]?.id);$('#detail').scrollIntoView({behavior:'smooth',block:'start'});
}
$('#byTopic').onclick=()=>{mode='topic';render()};$('#byDate').onclick=()=>{mode='date';render()};$('#search').oninput=render;render();
</script></body></html>
